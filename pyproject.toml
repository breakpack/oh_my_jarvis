[project]
name = "personal-ai-os"
version = "0.1.0"
description = "Extensible, local-first Personal AI OS"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests", "apps/cli/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
