[alembic]
# Path to migration scripts. `here` resolves to this ini file's directory,
# so this works regardless of the caller's current working directory
# (Makefile invokes `alembic -c migrations/alembic.ini ...` from repo root).
script_location = %(here)s

# sqlalchemy.url is intentionally omitted here; migrations/env.py reads it
# from the DATABASE_URL environment variable at runtime.

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
